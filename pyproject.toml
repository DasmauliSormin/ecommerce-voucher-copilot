[project]
name = "ecommerce-voucher-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dasmauli Sormin", email = "dasmauli06@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastmcp>=4.0.4",
    "google-genai>=2.23.0",
    "gradio>=6.27.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]

[project.scripts]
ecommerce-voucher-copilot = "ecommerce_voucher_copilot:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
